name: Node CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions: {}
concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    uses: roshan46/gha-reusable-workflows/.github/workflows/node-quality.yml@d05401d0f6d3f9f49e605965a85f979063630101
    with:
      node-version: '24.14.0'
    permissions:
      contents: read
  summary:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Write component summary
        uses: roshan46/gha-reusable-workflows/summary@d05401d0f6d3f9f49e605965a85f979063630101
        with:
          component: node-api

      - name: Show tested revision
        shell: bash
        env:
          REVISION: ${{ needs.quality.outputs.revision }}
        run: printf 'Tested %s\n' "$REVISION"
