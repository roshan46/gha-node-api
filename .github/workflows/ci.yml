name: Node CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions: {}
concurrency:
  group: node-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    uses: roshan46/gha-reusable-workflows/.github/workflows/node-quality.yml@e404a35011dc89c1d810ddac3bf5f238dfc8180f
    with:
      node-version: '24.14.0'
    permissions:
      contents: read
